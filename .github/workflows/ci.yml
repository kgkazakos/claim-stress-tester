name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build backend
        # 3.12 runner images no longer ship setuptools; install it before the
        # editable install or setuptools.build_meta is missing (learned on V1).
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install
        run: pip install -e ".[dev]" --no-build-isolation

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          cst --version
          cst paradigm
          cst run examples/sample.json --no-llm
          cst export examples/sample.json --no-llm -o /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert d['schema']=='cpr.cst.export/1'"
